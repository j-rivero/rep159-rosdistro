release_package_xmls:
  ament_cmake_core: '<?xml version="1.0" ?><?xml-model href="http://download.ros.org/schema/package_format2.xsd" schematypens="http://www.w3.org/2001/XMLSchema"?><package format="2"><name>ament_cmake_core</name><version>2.8.8</version><description>The core of the ament buildsystem in CMake. Several subcomponents provide specific funtionalities: * environment: provide prefix-level setup files * environment_hooks: provide package-level setup files and environment hooks * index: store information in an index and retrieve them without crawling * package_templates: templates from the ament_package Python package * symlink_install: use symlinks for CMake install commands</description><maintainer email="clalancette@gmail.com">Chris Lalancette</maintainer><license>Apache License 2.0</license><author>Dirk Thomas</author><author email="michel@ekumenlabs.com">Michel Hidalgo</author><buildtool_depend>cmake</buildtool_depend><buildtool_depend>ament_package</buildtool_depend><buildtool_depend>python3-catkin-pkg-modules</buildtool_depend><buildtool_export_depend>cmake</buildtool_export_depend><buildtool_export_depend>ament_package</buildtool_export_depend><buildtool_export_depend>python3-catkin-pkg-modules</buildtool_export_depend><export><build_type>ament_cmake</build_type></export></package>'
  ament_package: <?xml version="1.0" ?><?xml-model href="http://download.ros.org/schema/package_format2.xsd" schematypens="http://www.w3.org/2001/XMLSchema"?><package format="2"><name>ament_package</name><version>0.18.3</version><description>The parser for the manifest files in the ament buildsystem.</description><maintainer email="dharini@openrobotics.org">Dharini Dutia</maintainer><license>Apache License 2.0</license><author email="audrow@openrobotics.org">Audrow Nash</author><author email="dthomas@osrfoundation.org">Dirk Thomas</author><author email="mabel@openrobotics.org">Mabel Zhang</author><buildtool_export_depend>python3-setuptools</buildtool_export_depend><test_depend>python3-flake8</test_depend><test_depend>python3-pytest</test_depend><export><build_type>ament_python</build_type></export></package>
  ros_workspace: <?xml version="1.0" ?><?xml-model href="http://download.ros.org/schema/package_format2.xsd" schematypens="http://www.w3.org/2001/XMLSchema"?><package format="3"><name>ros_workspace</name><version>1.0.3</version><description>Provides the prefix level environment files for ROS 2 packages.</description><maintainer email="michael.jeronimo@openrobotics.org">Michael Jeronimo</maintainer><license file="LICENSE">Apache License 2.0</license><author email="steven@openrobotics.org">Steven! Ragnarök</author><build_depend>ament_cmake_core</build_depend><build_depend>ament_package</build_depend><buildtool_depend>cmake</buildtool_depend><export><build_type>cmake</build_type></export></package>
source_repo_package_xmls:
