%YAML 1.1
# binext: uses upstream's packages as the binaries upstream releases and
# builds only its own package (REP 159 extension_method: binary_import). No
# index_url: REP 159 then looks in this same index.
---
extends:
- distro_name: upstream
  extension_method: binary_import
release_platforms:
  ubuntu: [resolute]
repositories:
  downstream_bin_a:
    source: {type: git, url: https://github.com/rep159-testing/downstream_bin_a.git, version: main}
type: distribution
version: 3
